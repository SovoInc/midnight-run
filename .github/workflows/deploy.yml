name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build --release
        working-directory: server

      - name: Deploy to homebase
        env:
          SSH_KEY: ${{ secrets.HOMEBASE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"

          # Create deploy directory
          ssh $SSH_OPTS root@159.203.121.3 "mkdir -p /opt/midnight-run/static"

          # Upload binary and static files
          scp $SSH_OPTS server/target/release/midnight-runner-server root@159.203.121.3:/opt/midnight-run/midnight-runner-server.new
          rsync -az --delete -e "ssh $SSH_OPTS" server/static/ root@159.203.121.3:/opt/midnight-run/static/

          # Swap binary and restart
          ssh $SSH_OPTS root@159.203.121.3 "
            mv /opt/midnight-run/midnight-runner-server.new /opt/midnight-run/midnight-runner-server
            chmod +x /opt/midnight-run/midnight-runner-server
            systemctl restart midnight-run
          "
